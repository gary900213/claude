name: BTC daily report

on:
  schedule:
    # 每 6 小時一次（UTC）。台灣時間約 01:17 / 07:17 / 13:17 / 19:17。
    # 多跑幾次是為了把 OKX 清算單接成完整的一天，以及抓到美股收盤後的 ETF 數據。
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CJK font (圖表中文字)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Fetch data and build report
        run: python -m btc_daily.main

      # 幣安歷史原始檔（約 30 MB）不進 git，用快取保存，避免每次重新下載
      - name: Cache Binance raw files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: binance-raw-${{ github.run_id }}
          restore-keys: binance-raw-

      - name: Update Binance history
        run: python -m quant.history

      - name: Paper trading signal
        run: python -m quant.paper

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "沒有變更"
            exit 0
          fi
          git commit -m "chore: BTC daily update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
